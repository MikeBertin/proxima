<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proxima — the Sun's stellar neighbourhood in 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>" />
<meta name="description" content="An interactive 3D map of every star within ~5 parsecs of the Sun: mass, colour, size, distance, planets and more." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://mikebertin.github.io/proxima/" />
<meta property="og:title" content="Proxima — the Sun's stellar neighbourhood in 3D" />
<meta property="og:description" content="Every star within 5 parsecs of the Sun, mapped in real 3D. Scrub ±80,000 years of proper motion and watch Ross 248 become our nearest neighbour." />
<meta property="og:image" content="https://mikebertin.github.io/proxima/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://mikebertin.github.io/proxima/og.jpg" />
<style>
  :root{
    --bg:#07080f; --ink:#e7ecff; --dim:#9aa3c7; --line:#232a44;
    --panel:rgba(15,17,30,.86); --panel2:#1a1f38;
    --accent:#7cc4ff; --accent2:#c58bff; --warm:#ffcc6f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  canvas{display:block}
  #app{position:fixed;inset:0}

  .brand{position:fixed;top:14px;left:16px;z-index:10;pointer-events:none}
  .brand h1{margin:0;font-size:19px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--dim);font-family:var(--mono)}

  /* left control panel */
  .panel{position:fixed;z-index:10;background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  #controls{top:64px;left:16px;width:214px;font-size:12px}
  #controls .grp{margin-bottom:11px}
  #controls .grp:last-child{margin-bottom:0}
  #controls label.hd{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:1px;color:var(--dim);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:5px 8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:linear-gradient(90deg,rgba(124,196,255,.22),rgba(197,139,255,.22));border-color:var(--accent)}
  input[type=search]{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:12px;
    color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
  .results{margin-top:5px;max-height:180px;overflow:auto}
  .results div{padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--dim)}
  .results div:hover,.results div.sel{background:var(--panel2);color:var(--ink)}
  .swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

  /* info card */
  #info{top:64px;right:16px;width:270px;font-size:12.5px;display:none}
  #info.show{display:block}
  #info h2{margin:0 0 2px;font-size:17px}
  #info .sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:10px}
  #info .stats{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px}
  #info .stats dt{color:var(--dim)}
  #info .stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #info .planets{margin-top:10px;font-size:11.5px;color:var(--dim)}
  #info .planets b{color:var(--warm)}
  #i-system{margin-top:8px}
  #i-system .syshead{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
    letter-spacing:1px;color:var(--dim);margin-bottom:2px}
  #i-system svg{display:block;width:100%}
  #i-system circle.pl{cursor:pointer}
  #i-system .sysline{font-family:var(--mono);font-size:10.5px;color:var(--dim);
    min-height:15px;margin-top:2px}
  #i-system .sysline.hint{line-height:1.5}
  #i-system .sysline b{color:var(--ink)}
  #info .note{margin-top:10px;font-size:11.5px;line-height:1.45;color:#c3caea}
  #info .close{position:absolute;top:10px;right:12px;border:none;background:none;color:var(--dim);font-size:16px;padding:0;cursor:pointer}

  /* time-scrub */
  #time{left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,86vw);z-index:11}
  #time .top{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  #time .yr{font-family:var(--mono);font-size:15px;min-width:118px}
  #time .yr b{color:var(--accent);font-size:16px}
  #time .near{flex:1;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  #time .near b{color:var(--warm)}
  #time .scrub{display:flex;align-items:center;gap:9px}
  #time input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;
    background:#2a3252;outline:none}
  #time input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 0 3px rgba(124,196,255,.35)}
  #time .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:#5a638c;margin-top:4px}
  #time button{padding:5px 9px}
  #legend{bottom:16px;left:16px;font-size:11px;color:var(--dim);max-width:230px}
  #legend .sp{display:inline-flex;align-items:center;margin:0 9px 4px 0;font-family:var(--mono)}
  #hint{position:fixed;bottom:16px;right:16px;z-index:10;font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right;line-height:1.6}
  a{color:var(--accent)}
  .cnt{color:var(--accent)}

  /* mobile toggle chip (hidden on desktop) */
  #panel-toggle{display:none;position:fixed;top:14px;right:14px;z-index:12;
    font-size:13px;padding:7px 11px;border-radius:9px}

  /* --- mobile pass ------------------------------------------------------- */
  /* mid widths: time bar would collide with the corner panels — hide the hint
     and dock the bar between the legend and the right edge instead of centring */
  @media (max-width:1120px){
    #hint{display:none}
    #time{left:288px;right:16px;width:auto;transform:none}
  }
  @media (max-width:640px){
    .brand h1{font-size:16px}
    .brand p{font-size:9.5px}
    #legend{display:none}
    #panel-toggle{display:block}
    /* controls become a slide-in sheet, hidden until toggled */
    #controls{display:none;top:56px;left:10px;right:10px;width:auto;
      max-height:min(62vh,430px);overflow:auto}
    body.panel-open #controls{display:block}
    .results{max-height:130px}
    /* info card: full-width sheet under the header */
    #info{top:56px;left:10px;right:10px;width:auto;max-height:52vh;overflow:auto}
    /* time-scrub: full-width, compact (legend is hidden at this size) */
    #time{left:10px;right:10px;width:auto;transform:none;padding:9px 11px}
    #time .yr{font-size:13px;min-width:96px}
    #time .yr b{font-size:14px}
    #time .near{font-size:10px}
    #time .ticks{font-size:8.5px}
    button{padding:6px 9px}   /* bigger touch targets */
  }

  /* --- OG-capture mode (?og): hide chrome, keep the map + wordmark ------- */
  body.og .panel,body.og #hint,body.og #panel-toggle{display:none!important}
  body.og .brand{top:22px;left:26px}
  body.og .brand h1{font-size:34px}
  body.og .brand p{font-size:14px;margin-top:5px}
</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas></div>

<div class="brand">
  <h1>Proxima</h1>
  <p>the Sun's stellar neighbourhood · <span class="cnt" id="count">—</span> objects within 5 pc</p>
</div>

<button id="panel-toggle" title="controls">☰</button>

<div id="controls" class="panel">
  <div class="grp">
    <label class="hd">Find a star</label>
    <input id="search" type="search" placeholder="Sirius, Barnard, Tau Ceti…" autocomplete="off" />
    <div class="results" id="results"></div>
  </div>
  <div class="grp">
    <label class="hd">Show</label>
    <div class="row">
      <button id="t-labels" class="on">labels</button>
      <button id="t-shells" class="on">distance rings</button>
      <button id="t-galaxy" class="on">galaxy</button>
      <button id="t-planets">planet-hosts</button>
      <button id="t-paths">motion trails</button>
      <button id="t-grid3d" class="on">3D grid</button>
    </div>
  </div>
  <div class="grp">
    <label class="hd">Orient</label>
    <div class="row">
      <button id="v-gal" class="on">galactic plane</button>
      <button id="v-eq">equatorial</button>
    </div>
  </div>
  <div class="grp">
    <label class="hd">Filter</label>
    <div class="row">
      <button id="f-all" class="on">all</button>
      <button id="f-planets">has planets</button>
      <button id="f-bright">bright</button>
    </div>
  </div>
</div>

<div id="info" class="panel">
  <button class="close" id="info-close">×</button>
  <h2 id="i-name">—</h2>
  <div class="sub" id="i-sub">—</div>
  <dl class="stats" id="i-stats"></dl>
  <div class="planets" id="i-planets"></div>
  <div id="i-system"></div>
  <div class="note" id="i-note"></div>
</div>

<div id="time" class="panel">
  <div class="top">
    <div class="yr">t = <b id="t-year">now</b></div>
    <div class="near" id="t-near">nearest: Proxima Centauri · 4.25 ly</div>
  </div>
  <div class="scrub">
    <button id="t-play" title="play / pause">▶</button>
    <input id="t-slider" type="range" min="-80000" max="80000" step="500" value="0" />
    <button id="t-reset" title="back to now">⟲</button>
  </div>
  <div class="ticks"><span>−80,000 yr</span><span>now</span><span>+80,000 yr</span></div>
</div>

<div id="legend" class="panel">
  <div style="font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px">Spectral colour</div>
  <span class="sp"><span class="swatch" style="background:#aabfff"></span>A/B</span>
  <span class="sp"><span class="swatch" style="background:#fff4ea"></span>F</span>
  <span class="sp"><span class="swatch" style="background:#fff2a1"></span>G</span>
  <span class="sp"><span class="swatch" style="background:#ffcc6f"></span>K</span>
  <span class="sp"><span class="swatch" style="background:#ff7b4d"></span>M</span>
  <span class="sp"><span class="swatch" style="background:#c1440e"></span>L/T/Y</span>
  <span class="sp"><span class="swatch" style="background:#dfe9ff"></span>white dwarf</span>
</div>

<div id="hint">drag: orbit · scroll: zoom · click a star for stats<br/>toward <span style="color:var(--warm)">◎ galactic centre</span> · grid = 5 ly</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="proxima.js?v=5"></script>
</body>
</html>
